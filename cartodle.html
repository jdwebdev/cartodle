
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cartodle</title>
<style>
:root {
  color-scheme:dark;
  --bg:#12141c; --panel:#1b1e2b; --text:#e6e8f0; --muted:#8d93a6;
  --border:#2e3345; --accent:#7b8cff; --soft:#262c52;
  --btn:#252a3b; --head:#222638; --hover:#252b47; --rowline:#252a3a;
}
* { box-sizing:border-box; }
html,body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header {
  flex:none; padding:6px 16px; background:#0c0e15; color:white;
  font-size:18px; font-weight:800; letter-spacing:.3px;
  border-bottom:1px solid var(--border);
}
main {
  flex:1; min-height:0;
  display:grid; grid-template-columns:250px minmax(0,720px);
  grid-template-rows:minmax(0,1fr);
  gap:10px; padding:10px; align-items:stretch;
}
.panel {
  background:var(--panel); border:1px solid var(--border);
  border-radius:10px; padding:10px; min-width:0; min-height:0;
}
aside.panel { overflow-y:auto; }
section.panel { display:flex; flex-direction:column; }
h2 { font-size:13px; margin:0; color:var(--muted); letter-spacing:.5px; }
h3 { font-size:11px; margin:7px 0 3px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
.section { margin-bottom:0; }
.small { font-size:12px; color:var(--muted); }
.ref-number { font-size:30px; font-weight:800; text-align:center; line-height:1.1; padding:0; }
button {
  cursor:pointer; border:1px solid var(--border); background:var(--btn); color:var(--text);
  border-radius:6px; padding:6px 8px; font:inherit; font-weight:600;
}
button:hover { filter:brightness(1.2); }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
button.primary { background:var(--accent); color:#0c0e15; border-color:var(--accent); }
button.selected { background:var(--soft); border-color:var(--accent); color:var(--accent); }
button:disabled { opacity:.45; cursor:not-allowed; }
.full { width:100%; }
.direction { display:flex; align-items:center; justify-content:center; gap:4px; margin:0 0 2px; }
.direction .ref-number { flex:none; min-width:68px; }
.arrow-btn { width:68px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; }
.filters-toggle { display:none; }
html { -webkit-text-size-adjust:100%; }
button, select, input, .pokemon-row, .type-chip { touch-action:manipulation; }
button, .pokemon-row { user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
.type-actions { display:flex; gap:5px; margin-bottom:5px; }
.type-actions button { flex:1; font-size:11px; padding:3px 2px; }
.type-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.type-chip {
  border:2px solid transparent; border-radius:6px; min-height:23px;
  padding:2px 4px; font-size:12px; font-weight:750; line-height:1.1;
  display:flex; align-items:center; justify-content:center; text-align:center;
  opacity:.38; filter:grayscale(.75); background:var(--tc); color:var(--tf);
}
.type-chip.active { opacity:1; filter:none; border-color:rgba(255,255,255,.75); }
.stage-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.stage-chip { text-align:center; padding:4px 2px; font-size:11px; }
.stage-chip.active { background:var(--soft); border-color:var(--accent); color:var(--accent); }
select {
  width:100%; min-width:0; border:1px solid var(--border); background:var(--btn);
  color:var(--text); border-radius:5px; padding:3px 4px; font:inherit; font-size:12px;
}
.filter-line.rarity-line { grid-template-columns:30px minmax(0,1fr); row-gap:3px; }
.rarity-line .line-title { grid-column:1 / -1; margin-bottom:-2px; }
.rarity-line .mm { text-transform:none; font-weight:600; }
.rarity-line select { font-size:13px; padding:2px 6px; }
select { text-overflow:ellipsis; }
input[type="number"] {
  width:100%; min-width:0; border:1px solid var(--border); background:var(--btn);
  color:var(--text); border-radius:5px; padding:3px 6px; font:inherit; font-size:12px;
}
.filter-line { display:grid; grid-template-columns:62px 1fr 1fr; gap:5px; align-items:center; margin-top:6px; }
.filter-line span { font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; }
.checkline { flex:none; display:flex; align-items:center; gap:7px; font-size:12px; margin:0 0 8px; }
.checkline { cursor:pointer; position:relative; }
.checkline input { position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.switch {
  flex:none; width:38px; height:22px; border-radius:11px; position:relative;
  background:var(--btn); border:1px solid var(--border); transition:background .2s,border-color .2s;
}
.switch::after {
  content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:50%; background:var(--muted); transition:transform .2s,background .2s;
}
.checkline input:checked + .switch { background:var(--accent); border-color:var(--accent); }
.checkline input:checked + .switch::after { transform:translateX(16px); background:#fff; }
.checkline input:focus-visible + .switch { outline:2px solid var(--accent); outline-offset:2px; }
.results-head {
  flex:none; display:flex; align-items:center; justify-content:space-between;
  gap:8px; flex-wrap:wrap; margin-bottom:6px;
}
#count { font-size:12px; color:var(--muted); }
#results {
  flex:1; min-height:200px; overflow:auto;
  border:1px solid var(--border); border-radius:7px;
  background:#161926; position:relative; overflow-anchor:none;
}
#validateBtn { margin-top:2px; padding:8px; font-size:14px; }
header { display:flex; align-items:center; justify-content:space-between; }
header button { padding:3px 10px; font-size:12px; }
.dex-header,.pokemon-row {
  display:grid;
  grid-template-columns:36px minmax(130px,1fr) 145px 75px;
  gap:7px; align-items:center;
}
.dex-header {
  position:sticky; top:0; z-index:2; padding:6px 8px;
  background:var(--head); color:var(--muted); font-size:11px;
  font-weight:800; border-bottom:1px solid var(--border);
}
#rows { padding:0 5px; }
.pokemon-row {
  min-height:31px; padding:3px 3px; border-bottom:1px solid var(--rowline);
  cursor:pointer; border-radius:3px;
}
.pokemon-row:hover { background:var(--hover); }
.pokemon-row.reference { outline:2px solid var(--accent); outline-offset:-2px; }
.pokemon-row.outside { opacity:.3; filter:grayscale(1); }
.dexnum { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
.pokemon-name {
  min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-size:12px; font-weight:650;
}
.pokemon-types { display:flex; align-items:center; gap:3px; min-width:0; }
.type-badge {
  display:inline-flex; justify-content:center; align-items:center;
  padding:3px 5px; min-height:20px; border-radius:5px;
  white-space:nowrap; font-size:10px; font-weight:800;
}
.pokemon-stage { font-size:10px; color:var(--muted); white-space:nowrap; text-align:left; }
@media(max-width:760px) {
  body { height:100vh; height:100dvh; overflow:hidden; }
  main { display:flex; flex-direction:column; gap:7px; }
  .filters-toggle {
    flex:none; display:flex; align-items:center; gap:10px;
    width:100%; padding:10px 12px; font-size:15px;
  }
  .filters-toggle .summary { flex:1; text-align:right; font-size:12px; font-weight:500; color:var(--muted); }
  .filters-toggle svg { transition:transform .2s; }
  body.filters-open .filters-toggle svg { transform:rotate(180deg); }
  aside.panel { display:none; }
  body.filters-open aside.panel { display:block; flex:1; }
  section.results-panel { flex:1; }
  body.filters-open section.results-panel { display:none; }
  #results { min-height:0; }
  .type-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .arrow-btn { width:96px; height:42px; }
  .filter-line { margin-top:4px; }
  select, input[type="number"], .rarity-line select { font-size:16px; padding:4px 8px; }
  .type-chip { min-height:30px; font-size:14px; }
  .stage-chip { font-size:13px; padding:6px 2px; }
  .type-actions button { font-size:13px; padding:5px 2px; }
  #validateBtn { padding:10px; font-size:16px; margin-top:6px; }
  .checkline { font-size:14px; }
}
@media(max-width:470px) {
  header { padding:8px 12px; }
  main { padding:7px; gap:7px; }
  .panel { padding:9px; }
  .dex-header,.pokemon-row {
    grid-template-columns:31px minmax(90px,1fr) 105px 62px; gap:4px;
  }
  .pokemon-name { font-size:11px; }
  .type-badge { font-size:9px; padding:2px 3px; }
  .pokemon-stage { font-size:9px; }
}
</style>
</head>
<body>
<header><span>Cartodle</span><button id="resetBtn">Réinitialiser</button></header>
<main>
  <button id="filtersToggle" class="filters-toggle" aria-expanded="true" aria-controls="filtersPanel">
    <span>Filtres</span>
    <span id="filtersSummary" class="summary"></span>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <aside class="panel" id="filtersPanel">
    <section class="section">
      <div class="direction">
        <button id="lowerBtn" class="arrow-btn selected" title="Plus petit" aria-label="Plus petit">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div id="refNumber" class="ref-number">511</div>
        <button id="higherBtn" class="arrow-btn" title="Plus grand" aria-label="Plus grand">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div id="interval" class="small" style="text-align:center">N° 1 – 1025</div>
    </section>

    <section class="section">
      <h3>Types JCC</h3>
      <div class="type-actions">
        <button id="noneTypes">Tout décocher</button>
        <button id="allTypes">Tout cocher</button>
      </div>
      <div id="typeFilters" class="type-grid"></div>
    </section>

    <section class="section">
      <h3>Stade évolutif</h3>
      <div id="stageFilters" class="stage-grid"></div>
    </section>

    <section class="section">
      <div class="filter-line">
        <span>Année</span>
        <select id="yearMin" aria-label="Année minimale"></select>
        <select id="yearMax" aria-label="Année maximale"></select>
      </div>
      <div class="filter-line">
        <span>PV</span>
        <select id="hpMin" aria-label="PV minimum"></select>
        <select id="hpMax" aria-label="PV maximum"></select>
      </div>
      <div class="filter-line rarity-line">
        <span class="line-title">Rareté</span>
        <span class="mm">Min</span><select id="rarityMin" aria-label="Rareté minimale"></select>
        <span class="mm">Max</span><select id="rarityMax" aria-label="Rareté maximale"></select>
      </div>
    </section>

    <button id="validateBtn" class="primary full">Valider le tour</button>
  </aside>

  <section class="panel results-panel">
    <label class="checkline">
      <input type="checkbox" id="showOthers" role="switch">
      <span class="switch" aria-hidden="true"></span>
      <span>Afficher les autres</span>
    </label>
    <div class="results-head">
      <h2>Pokémon</h2>
      <span id="count">Chargement…</span>
    </div>
    <div id="results">
      <div class="dex-header">
        <span>N°</span><span>Nom</span><span>Type(s)</span><span>Stade</span>
      </div>
      <div id="rows"></div>
    </div>
  </section>
</main>

<script>
"use strict";


const TCG = [
  "Plante","Feu","Eau","Électrique","Psy","Combat",
  "Incolore","Obscurité","Métal","Dragon","Fée"
];
const STAGES = ["Base","Niveau 1","Niveau 2"];

// Couleurs des énergies du JCC Pokémon (filtres).
const TCG_COLORS = {
  "Plante":"#5FB946",
  "Feu":"#E8432B",
  "Eau":"#2D9CDB",
  "Électrique":"#F7C913",
  "Psy":"#A8479F",
  "Combat":"#B5651D",
  "Incolore":"#D4D0C8",
  "Obscurité":"#2F3A4A",
  "Métal":"#9AA5AE",
  "Dragon":"#C8A12A",
  "Fée":"#F29DC4"
};

// Couleurs officielles des types des jeux (badges du listing).
const GAME_COLORS = {
  normal:"#A8A77A", fire:"#EE8130", water:"#6390F0", electric:"#F7D02C",
  grass:"#7AC74C", ice:"#96D9D6", fighting:"#C22E28", poison:"#A33EA1",
  ground:"#E2BF65", flying:"#A98FF3", psychic:"#F95587", bug:"#A6B91A",
  rock:"#B6A136", ghost:"#735797", dragon:"#6F35FC", dark:"#705746",
  steel:"#B7B7CE", fairy:"#D685AD", stellar:"#40B5A5"
};

function textOn(hex) {
  const n=parseInt(hex.slice(1),16);
  const lum=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255;
  return lum>0.6 ? "#1a1a1a" : "#ffffff";
}

const GAME_TO_TCG = {
  grass:["Plante"],
  fire:["Feu"],
  water:["Eau"],
  electric:["Électrique"],
  psychic:["Psy"],
  ghost:["Psy"],
  poison:["Plante","Psy","Obscurité"],
  fairy:["Psy","Fée"],
  fighting:["Combat"],
  rock:["Combat"],
  ground:["Combat"],
  normal:["Incolore"],
  flying:["Incolore"],
  dragon:["Incolore","Dragon"],
  dark:["Obscurité"],
  steel:["Métal"],
  ice:["Eau"],
  bug:["Plante"],
  stellar:[]
};

const TYPE_FR = {
  grass:"Plante",fire:"Feu",water:"Eau",electric:"Électrique",
  psychic:"Psy",ghost:"Spectre",poison:"Poison",fairy:"Fée",
  fighting:"Combat",rock:"Roche",ground:"Sol",normal:"Normal",
  flying:"Vol",dragon:"Dragon",dark:"Ténèbres",steel:"Acier",
  ice:"Glace",bug:"Insecte",stellar:"Stellaire"
};

const MAP_TCG_TO_GAME = {
  "Plante":["grass","bug","poison"],
  "Feu":["fire"],
  "Eau":["water","ice"],
  "Électrique":["electric"],
  "Psy":["psychic","ghost","poison","fairy"],
  "Combat":["fighting","rock","ground"],
  "Incolore":["normal","flying","dragon"],
  "Obscurité":["dark","poison"],
  "Métal":["steel"],
  "Dragon":["dragon"],
  "Fée":["fairy"]
};

const state = {
  ref:511, lo:1, hi:1025, direction:"lower",
  selectedTypes:new Set(TCG), selectedStages:new Set(STAGES),
  showOthers:false, pokemon:[], loaded:false
};

const $ = id => document.getElementById(id);

const YEAR_FIRST = 1999;
const YEAR_LAST = new Date().getFullYear();
["yearMin","yearMax"].forEach(id=>{
  const sel=$(id);
  for(let y=YEAR_FIRST;y<=YEAR_LAST;y++) sel.add(new Option(y,y));
});
$("yearMin").value=YEAR_FIRST;
$("yearMax").value=YEAR_LAST;
// PV (filtre informatif) : de 30 à 380 par pas de 10.
const HP_FIRST = 30, HP_LAST = 380;
["hpMin","hpMax"].forEach(id=>{
  const sel=$(id);
  for(let v=HP_FIRST;v<=HP_LAST;v+=10) sel.add(new Option(v,v));
});
function resetHp() {
  $("hpMin").value=HP_FIRST; $("hpMax").value=HP_LAST;
}
resetHp();
$("hpMin").onchange=()=>{
  if(Number($("hpMax").value)<Number($("hpMin").value))
    $("hpMax").value=$("hpMin").value;
};
$("hpMax").onchange=()=>{
  if(Number($("hpMin").value)>Number($("hpMax").value))
    $("hpMin").value=$("hpMax").value;
};

// Raretés simplifiées (filtre informatif).
const RARITIES = [
  {label:"● Commune",               bg:"#d9d9de"},
  {label:"◆ Peu commune",           bg:"#4ade80"},
  {label:"★ Rare",                  bg:"#38bdf8"},
  {label:"★ Rare Holo",             bg:"#c084fc"},
  {label:"★★ Double rare",          bg:"#c084fc"},
  {label:"★★ Double rare brillante",bg:"#fcd34d"},
  {label:"★★★ Ultra rares",         bg:"linear-gradient(90deg,#f9a8d4,#a5b4fc,#99f6e4,#fde68a)"}
];
function paintRarity(sel) {
  const r=RARITIES[Number(sel.value)-1];
  sel.style.background=r.bg; sel.style.color="#14161f";
  sel.style.fontWeight="700"; sel.title=r.label;
}
["rarityMin","rarityMax"].forEach(id=>{
  const sel=$(id);
  RARITIES.forEach((r,i)=>{
    const o=new Option(r.label,i+1);
    o.style.background=r.bg.startsWith("#")?r.bg:"#c4b5fd"; o.style.color="#14161f";
    sel.add(o);
  });
});
function resetRarity() {
  $("rarityMin").value=1; $("rarityMax").value=RARITIES.length;
  paintRarity($("rarityMin")); paintRarity($("rarityMax"));
}
resetRarity();
// Garde-fou rareté : max >= min.
$("rarityMin").onchange=()=>{
  if(Number($("rarityMax").value)<Number($("rarityMin").value))
    $("rarityMax").value=$("rarityMin").value;
  paintRarity($("rarityMin")); paintRarity($("rarityMax"));
};
$("rarityMax").onchange=()=>{
  if(Number($("rarityMin").value)>Number($("rarityMax").value))
    $("rarityMin").value=$("rarityMax").value;
  paintRarity($("rarityMin")); paintRarity($("rarityMax"));
};
// Garde-fou : l'année max reste toujours >= à l'année min.
$("yearMin").onchange=()=>{
  if(Number($("yearMax").value)<Number($("yearMin").value))
    $("yearMax").value=$("yearMin").value;
};
$("yearMax").onchange=()=>{
  if(Number($("yearMin").value)>Number($("yearMax").value))
    $("yearMin").value=$("yearMax").value;
};
function getTcgTypes(gameTypes, num) {
  // Arceus reste toujours admissible au filtre de type.
  if(num===493) return [];
  const out=new Set();
  for(const t of gameTypes) {
    (GAME_TO_TCG[t]||[]).forEach(x=>out.add(x));
  }
  return [...out];
}

function typesMatch(p) {
  if(p.num===493) return true;
  if(state.selectedTypes.size===0) return false;
  const tcg=getTcgTypes(p.gameTypes,p.num);
  return tcg.some(t=>state.selectedTypes.has(t));
}

function stageMatch(p) {
  return state.selectedStages.has(p.stage);
}

function matches(p) {
  return p.num>=state.lo && p.num<=state.hi &&
    typesMatch(p) && stageMatch(p);
}

function renderTypeFilter() {
  $("typeFilters").innerHTML="";
  TCG.forEach(t=>{
    const b=document.createElement("button");
    b.className="type-chip"+(state.selectedTypes.has(t)?" active":"");
    const bg=TCG_COLORS[t], fg=textOn(bg);
    b.style.setProperty("--tc",bg);b.style.setProperty("--tf",fg);
    b.textContent=t;
    b.setAttribute("aria-pressed",state.selectedTypes.has(t)?"true":"false");
    b.onclick=()=>{
      if(state.selectedTypes.has(t)) state.selectedTypes.delete(t);
      else state.selectedTypes.add(t);
      renderTypeFilter();render();
    };
    $("typeFilters").appendChild(b);
  });
}

function renderStageFilter() {
  $("stageFilters").innerHTML="";
  STAGES.forEach(s=>{
    const b=document.createElement("button");
    b.className="stage-chip"+(state.selectedStages.has(s)?" active":"");
    b.textContent=s;
    b.setAttribute("aria-pressed",state.selectedStages.has(s)?"true":"false");
    b.onclick=()=>{
      if(state.selectedStages.has(s)) state.selectedStages.delete(s);
      else state.selectedStages.add(s);
      renderStageFilter();render();
    };
    $("stageFilters").appendChild(b);
  });
}

function badgeFor(gameType) {
  const fr=TYPE_FR[gameType]||gameType;
  const bg=GAME_COLORS[gameType]||"#888888", fg=textOn(bg);
  const span=document.createElement("span");
  span.className="type-badge";
  span.style.background=bg;span.style.color=fg;
  span.textContent=fr;
  span.title="Type des jeux : "+fr;
  return span;
}

function appendTypes(container,p) {
  if(!p.gameTypes.length) {
    const a=document.createElement("span");
    a.className="type-badge";a.style.background="#eee";a.style.color="#555";
    a.textContent="—";container.appendChild(a);return;
  }
  p.gameTypes.forEach(t=>container.appendChild(badgeFor(t)));
}

function render() {
  $("refNumber").textContent=String(state.ref).padStart(3,"0");
  $("interval").textContent="N° "+state.lo+" – "+state.hi;
  $("filtersSummary").textContent=
    "ID "+String(state.ref).padStart(3,"0")+" · N° "+state.lo+" – "+state.hi;
  const rows=$("rows");rows.innerHTML="";
  if(!state.loaded) {
    $("count").textContent="Chargement…";
    return;
  }

  const candidates=state.pokemon.filter(p=>p.num>=state.lo && p.num<=state.hi);
  const matching=candidates.filter(p=>typesMatch(p)&&stageMatch(p));
  const visible=state.showOthers ? candidates : matching;
  $("count").textContent=matching.length+" résultat(s) · "+visible.length+" affiché(s)";

  visible.sort((a,b)=>a.num-b.num || a.displayName.localeCompare(b.displayName,"fr"));
  visible.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="pokemon-row";
    if(!matches(p)) row.classList.add("outside");
    if(p.num===state.ref) row.classList.add("reference");
    row.tabIndex=0;
    row.setAttribute("role","button");
    row.setAttribute("aria-label",p.displayName+", numéro "+p.num);
    const n=document.createElement("span");n.className="dexnum";
    n.textContent=String(p.num).padStart(3,"0");
    const name=document.createElement("span");name.className="pokemon-name";
    name.textContent=p.displayName;name.title=p.displayName;
    const types=document.createElement("span");types.className="pokemon-types";
    appendTypes(types,p);
    const stage=document.createElement("span");stage.className="pokemon-stage";
    stage.textContent=p.stage;
    row.append(n,name,types,stage);
    const choose=()=>{
      state.ref=p.num;
      render();
    };
    row.onclick=choose;
    row.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose();}};
    rows.appendChild(row);
  });

  // Centrer le candidat médian dans la zone de résultats.
  if(!state.showOthers && matching.length) {
    const mid=Math.floor(matching.length/2);
    const median=matching[mid];
    const index=visible.findIndex(p=>p.id===median.id);
    const target=rows.children[index];
    if(target) {
      const center=()=>{
        const box=$("results");
        if(!box.clientHeight || !target.isConnected) return; // listing masqué
        const headerH=box.querySelector(".dex-header").offsetHeight;
        const mid=(box.clientHeight+headerH)/2;
        box.scrollTop=Math.max(0,target.offsetTop+target.offsetHeight/2-mid);
      };
      // Plusieurs passes : sur mobile la mise en page (affichage du listing,
      // barre d'adresse) peut ne pas être stabilisée au premier rendu.
      const token=++centerToken;
      requestAnimationFrame(()=>{
        center();
        requestAnimationFrame(center);
        setTimeout(()=>{ if(token===centerToken) center(); },120);
      });
    }
  }
}
let centerToken=0;

function validateTurn() {
  const n=state.ref;
  let lo=state.lo,hi=state.hi;
  if(state.direction==="lower") hi=Math.min(hi,n-1);
  else lo=Math.max(lo,n+1);
  if(lo>hi) {
    alert("Il n’y a plus de Pokémon dans cette direction.");
    return;
  }
  state.lo=lo;state.hi=hi;
  // Sélectionne automatiquement la ligne du milieu des résultats (comme un clic).
  const matching=state.pokemon.filter(matches)
    .sort((a,b)=>a.num-b.num || a.displayName.localeCompare(b.displayName,"fr"));
  if(matching.length) state.ref=matching[Math.floor(matching.length/2)].num;
  setFiltersOpen(false); // mobile : referme les filtres et affiche le listing
  render();
}

// Mobile : section des filtres enroulable / déroulable (sans effet sur desktop).
function setFiltersOpen(open) {
  document.body.classList.toggle("filters-open",open);
  $("filtersToggle").setAttribute("aria-expanded",open?"true":"false");
}
$("filtersToggle").onclick=()=>{
  setFiltersOpen(!document.body.classList.contains("filters-open"));
  render(); // recentre le listing une fois visible
};
setFiltersOpen(true);

function reset() {
  state.ref=511;state.lo=1;state.hi=1025;state.direction="lower";
  state.selectedTypes=new Set(TCG);state.selectedStages=new Set(STAGES);
  state.showOthers=false;
  $("showOthers").checked=false;
  resetRarity();resetHp();
  $("yearMin").value=YEAR_FIRST;$("yearMax").value=YEAR_LAST;
  $("lowerBtn").classList.add("selected");
  $("higherBtn").classList.remove("selected");
  renderTypeFilter();renderStageFilter();render();
}

$("lowerBtn").onclick=()=>{
  state.direction="lower";

};
$("higherBtn").onclick=()=>{
  state.direction="higher";
  $("higherBtn").classList.add("selected");
  $("lowerBtn").classList.remove("selected");
};
$("validateBtn").onclick=validateTurn;
$("resetBtn").onclick=reset;
$("allTypes").onclick=()=>{state.selectedTypes=new Set(TCG);renderTypeFilter();render();};
$("noneTypes").onclick=()=>{state.selectedTypes.clear();renderTypeFilter();render();};
